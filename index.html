let sortK = 'url', sortDir = 1;
const badgeClass = s => 'b-' + (s||'').replace(/[^A-Za-z0-9]+/g,'-');
document.querySelectorAll('th').forEach(th=>{
  th.onclick = ()=>{
    const k = th.dataset.k;
    if (sortK===k) sortDir=-sortDir; else { sortK=k; sortDir=1; }
    render();
  };
});
function render(){
  const q = (document.getElementById('q').value||'').toLowerCase();
  const fs = document.getElementById('fStatus').value;
  const ft = document.getElementById('fType').value;
  const fsm = document.getElementById('fSitemap').value;
  let rows = ROWS.filter(r=>{
    if (fs && r.status!==fs) return false;
    if (ft && r.type!==ft) return false;
    if (fsm==='yes' && !r.in_sitemap) return false;
    if (fsm==='no' && r.in_sitemap) return false;
    if (q && !((r.url||'').toLowerCase().includes(q) || (r.type||'').toLowerCase().includes(q))) return false;
    return true;
  });
  rows.sort((a,b)=>{
    let x=a[sortK], y=b[sortK];
    x=x==null?'':String(x); y=y==null?'':String(y);
    return x<y?-sortDir : x>y?sortDir : 0;
  });
  function fmtDate(t){ if (!t) return '—'; const d = new Date(t); if (isNaN(d)) return '—'; return d.toISOString().slice(0,10) + ' ' + d.toISOString().slice(11,16) + ' UTC'; }
  const tb=document.getElementById('tbody');
  tb.innerHTML = rows.map(r=>
    `<tr><td class="url"><a href="${r.url}" target="_blank" rel="noopener">${r.url}</a></td>`+
    `<td class="type">${r.type}</td>`+
    `<td class="lu">${fmtDate(r.lastUpdated)}</td>`+
    `<td class="lc">${fmtDate(r.lastCrawlTime)}</td>`+
    `<td><span class="badge ${r.in_sitemap ? 'b-yes' : 'b-no'}">${r.in_sitemap ? 'Yes' : 'No'}</span></td>`+
    `<td><span class="badge ${badgeClass(r.status)}">${r.status}</span></td></tr>`
  ).join('');
  document.getElementById('count').textContent = `{rows.length} of 912`;
}
render();
